<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/global.css" rel="stylesheet">
    <link href="../css/header.css" rel="stylesheet">
    <link href="../css/footer.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Nodo Norte</title>
    <link rel="icon" type="icon/png" href="../img/Favicon_Nodo-Norte.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <footer>
        <div class="container-fluid px-4 px-lg-5">
            <div class="row gy-4 align-items-center justify-content-md-between">
                <div class="col-12 col-md-auto nn-footer-logo">
                    <span class="nn-logo" role="img" aria-label="Nodo Norte. Comunidad tecnológica A Coruña"><img
                            src="../img/nodo-norte-n.svg" alt=""><span class="nn-logo-texto" aria-hidden="true">Nodo
                            Norte</span></span>
                </div>
                <div class="col-12 col-md-auto nn-footer-social">
                    <h3 class="h6 mb-3">Síguenos</h3>
                    <ul class="list-unstyled mb-0">
                        <li>
                            <a href="https://www.instagram.com/" target="_blank">
                                <img src="../img/logo-instagram.svg" alt="">
                                Instagram
                            </a>
                        </li>
                        <li>
                            <a href="https://mastodon.social/explore" target="_blank">
                                <img src="../img/logo-mastodon.svg" alt="">
                                Mastodon
                            </a>
                        </li>
                        <li>
                            <a href="https://bsky.app/" target="_blank">
                                <img src="../img/logo-bluesky.svg" alt="">
                                Bluesky
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="col-12 col-md-auto nn-footer-newsletter">
                    <h3 class="h6 mb-3">Newsletter</h3>
                    <form class="needs-validation" novalidate>
                        <div class="input-group">
                            <input id="correo-footer" type="email" class="form-control" placeholder="tu@correo"
                                required>
                            <button class="btn-primary" type="submit">Apuntarme</button>
                        </div>
                        <div class="invalid-feedback">Introduce un correo válido.</div>
                    </form>
                </div>
            </div>
            <p class="mb-0 copyright-text text-center">© Nodo Norte ·
                <a href="mailto:info@nodonorte.org">Contacto por correo electrónico</a>
            </p>
        </div>
    </footer>
    <script src="../js/validacion-newsletter-footer.js"></script>
</body>

</html>
